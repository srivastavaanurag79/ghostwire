name: Release Android APK

# Builds the Android APK and attaches it to a GitHub Release (as ghostwire.apk).
# Runs on version tags (v*) and manually from the Actions tab. It does NOT run on
# ordinary pushes, so normal CI stays fast.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Build the shared packages the native app consumes from `dist`.
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build

      - name: Install native deps
        working-directory: apps/native
        run: npm install

      - name: Prebuild Android project
        working-directory: apps/native
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK (arm64)
        working-directory: apps/native/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Rename APK
        run: cp apps/native/android/app/build/outputs/apk/release/app-release.apk ghostwire.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghostwire-apk
          path: ghostwire.apk

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ghostwire.apk
